# Conditional DiffusionTS for Power (tractID, C1=1, K=56).
# Train:  python main.py --name power_cond --config_file Config/Extreme/power.yaml --train --condition
# Sample: python main.py --name power_cond --config_file Config/Extreme/power.yaml --sample --condition
# Unconditional (omit --condition): same config, cond paths ignored.

model:
  target: Models.interpretable_diffusion.gaussian_diffusion.DiffusionTS
  params:
    seq_length: 180
    feature_size: 1
    n_layer_enc: 2
    n_layer_dec: 2
    d_model: 64  # 4 X 16
    timesteps: 500
    fast_sampling: False
    sampling_timesteps: 500
    loss_type: 'l1'
    beta_schedule: 'cosine'
    n_heads: 4
    mlp_hidden_times: 4
    attn_pd: 0.0
    resid_pd: 0.0
    kernel_size: 1
    padding_size: 0

    heavy: False
    heavy_nu: 2.5
    heavy_var_correction: True
    var_loss_weight: 0

    sanity_prob: 0.002
    sanity_quantile: 0.999
    sanity_compare_ref: True
    sanity_check_xt: True

    use_condition: false
    cond_dim: 1
    num_classes_per_cond: [56]
    cond_dropout: 0.15
    cfg_scale: 1.5

solver:
  base_lr: 1.0e-5
  max_epochs: 10000
  results_folder: ./Checkpoint
  gradient_accumulate_every: 2
  save_cycle: 1000
  ema:
    decay: 0.995
    update_interval: 10

  scheduler:
    target: engine.lr_sch.ReduceLROnPlateauWithWarmup
    params:
      factor: 0.5
      patience: 2000
      min_lr: 1.0e-5
      threshold: 1.0e-1
      threshold_mode: rel
      warmup_lr: 8.0e-4
      warmup: 500
      verbose: False

train:
  params:
    data_path: ./Data/Power/Tallahassee_seq_180_sample_50000.npy
    cond_path: ./Data/Power/Tallahassee_seq_180_sample_50000_condition.npy
    sample_number: 50000
    seq_length: 180
    batch_size: 64

sample:
  params:
    num_samples: 1000
    batch_size: 100
    sample_seed: 42
    # (num_samples, 1, 1); use a dedicated file if sampling cond differs from training
    cond_path: ./Data/Power/Tallahassee_seq_180_sample_50000_condition.npy
    whe_trace: False
