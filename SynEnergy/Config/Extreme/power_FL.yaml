# SynEnergy FL (Tallahassee 10k) — unified backbone + ControlNet config.
# Stage 1 & 2 share the same --name and this file.
#
# Stage 1 backbone:
#   python main.py --name power_FL1 --config_file Config/Extreme/power_FL.yaml --train --condition
# Stage 2 ControlNet:
#   python main.py --name power_FL1 --config_file Config/Extreme/power_FL.yaml --train --controlnet --condition
# Sample (backbone):
#   python main.py --name power_FL1 --config_file Config/Extreme/power_FL.yaml --sample --condition
# Sample (ControlNet):
#   python main.py --name power_FL1 --config_file Config/Extreme/power_FL.yaml --sample --controlnet --condition

train:
  params:
    data_path: ./Data/Power/Tallahassee_seq_180_sample_10000.npy
    cond_path: ./Data/Power/Tallahassee_seq_180_sample_10000_condition.npy
    sample_number: 10000
    seq_length: 180
    batch_size: 64

sample:
  params:
    num_samples: 10000
    batch_size: 500
    sample_seed: 42
    cond_path: ./Data/Power/Tallahassee_seq_180_sample_10000_condition.npy
    whe_trace: False

backbone:
  model:
    target: Models.interpretable_diffusion.gaussian_diffusion.DiffusionTS
    params:
      seq_length: 180
      feature_size: 1
      n_layer_enc: 2
      n_layer_dec: 2
      d_model: 64
      timesteps: 500
      fast_sampling: False
      sampling_timesteps: 500
      loss_type: 'l1'
      beta_schedule: 'cosine'
      n_heads: 4
      mlp_hidden_times: 4
      attn_pd: 0.0
      resid_pd: 0.0
      kernel_size: 1
      padding_size: 0

      heavy: False
      heavy_nu: 2.5
      heavy_var_correction: True
      var_loss_weight: 0

      sanity_prob: 0.002
      sanity_quantile: 0.999
      sanity_compare_ref: True
      sanity_check_xt: True

      use_condition: false
      cond_dim: 1
      num_classes_per_cond: [56]
      cond_dropout: 0.15
      cfg_scale: 1.5

  solver:
    base_lr: 1.0e-5
    max_epochs: 10000
    results_folder: ./Checkpoint
    gradient_accumulate_every: 2
    save_cycle: 1000
    ema:
      decay: 0.995
      update_interval: 10
    scheduler:
      target: engine.lr_sch.ReduceLROnPlateauWithWarmup
      params:
        factor: 0.5
        patience: 2000
        min_lr: 1.0e-5
        threshold: 1.0e-1
        threshold_mode: rel
        warmup_lr: 8.0e-4
        warmup: 500
        verbose: False

stage2:
  model:
    target: Models.interpretable_diffusion.diffusion_controlnet.DiffusionTSControlNet
    params:
      seq_length: 180
      feature_size: 1
      n_layer_enc: 2
      n_layer_dec: 2
      d_model: 64
      timesteps: 500
      fast_sampling: False
      sampling_timesteps: 500
      loss_type: 'l1'
      beta_schedule: 'cosine'
      n_heads: 4
      mlp_hidden_times: 4
      attn_pd: 0.0
      resid_pd: 0.0
      kernel_size: 1
      padding_size: 0

      heavy: False
      heavy_nu: 2.5
      heavy_var_correction: True
      var_loss_weight: 0

      sanity_prob: 0.002
      sanity_quantile: 0.999
      sanity_compare_ref: True
      sanity_check_xt: True

      use_condition: true
      cond_dim: 1
      num_classes_per_cond: [56]
      cond_dropout: 0.15
      cfg_scale: 1.5

      z_a_dim: 64
      z_a_dropout: 0.1
      control_scale: 0.04
      control_t_start: 0
      use_decode_map: true
      decode_map_channels: 2

      use_p_hat_gate: true
      gate_z_hint: true
      gate_control_output: false
      p_hat_gate_mode: power
      p_hat_gate_power: 1.5
      p_hat_gate_floor: 0.0
      p_hat_gate_detach: true

  ae:
    hidden_dim: 64
    latent_dim: 64
    num_layers: 3
    dropout: 0.1
    output_scale: 1.0
    model_eps: 1.0e-6
    batch_size: 128
    extract_batch_size: 256
    lr: 1.0e-3
    num_epochs: 200
    lambda_mask: 1.0
    lambda_anom: 2.0
    lambda_zero: 1.0
    lambda_sign: 0.1
    pos_weight_value: 1.0
    lambda_gate_zero: 0.2
    lambda_gate_anom: 0.2
    gate_normal_threshold: 0.1
    gate_anom_threshold: 0.3
    anom_weight_threshold: 0.5

    graph:
      enabled: true
      train: true
      dual_graph: true
      inject_scale: 1.0e-4
      lambda_pre: 0.1
      graph_lr: 1.0e-3
      graph_epochs: 50
      graph_ckpt: graph.pt
      affinity_path: ./Data/Power/Tallahassee_tract_spatial_matrix_56.npy
      spatial_affinity_path: ./Data/Power/Tallahassee_tract_spatial_matrix_56.npy
      attribute_affinity_path: ./Data/Power/Tallahassee_tract_attribute_matrix_56.npy
      max_hop: 2
      edge_eps: 0.0
      eps: 1.0e-8
      gate_bias_init: -10.0
      init_identity: true

  controlnet:
    backbone_run_name: auto
    backbone_output_dir: auto
    backbone_ckpt: checkpoint_backbone.pt
    controlnet_ckpt: checkpoint_controlnet.pt
    lambda_z: 0.02
    lambda_anom: 0.06
    lambda_zero: 0.08
    anom_on_x0: true
    anom_mask_mode: soft
    filter_threshold: 0.12
    filter_mode: soft
    filter_gamma: 50.0
    occurrence_threshold: 0.12
    num_days: 30
    slots_per_day: 6
    residual_eps: 1.0e-6
    min_scale: 1.0
    use_mad_consistency: true
    loss_eps: 1.0e-6

  solver:
    base_lr: 1.0e-4
    max_epochs: 1000
    results_folder: ./Checkpoint
    gradient_accumulate_every: 1
    save_cycle: 50
    ema:
      decay: 0.995
      update_interval: 10
    scheduler:
      target: engine.lr_sch.ReduceLROnPlateauWithWarmup
      params:
        factor: 0.5
        patience: 30
        min_lr: 1.0e-6
        threshold: 1.0e-1
        threshold_mode: rel
        warmup_lr: 5.0e-4
        warmup: 20
        verbose: False
