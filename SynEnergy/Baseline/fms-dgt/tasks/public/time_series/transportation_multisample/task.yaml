######################################################
#                   MANDATORY FIELDS
######################################################
task_name: time_series/transportation_multisample
task_description: Univariate time series from transportation (1096 trajectories × length 144).
created_by: SynEnergy

data_builder: time_series

######################################################
#                   RESERVED FIELDS
######################################################
data:
  type: default
  data_path: ${DGT_DATA_DIR}/public/time_series/transportation_seq_144_sample_1320.parquet

######################################################
#                   TASK FIELDS
######################################################
data_params:
  train_length: 144
  train_samples: 1320
  augmentation_strategy: multisample
  train_channels:
    - "TOY-"

# sdforger args
sdforger_params:
  k_bit: null
  min_outputs_to_generate: 1320
  max_outputs_to_generate: 1320
  inference_batch: 64
  norms_diversity_threshold: 0 # disable diversity early-stop; final count may still be <1000 after dedup/IQR
  embedding_type: "fica"
  embedding_dim: auto
  variance_explained: 0.7
  min_windows_number: 30
  min_windows_length: 144
  input_tokens_precision: 4
